<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';">
  <title>DONATE // BITCOIN</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .donate-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .qr-frame {
      padding: 14px;
      background: #ffffff;
      border-radius: 10px;
      line-height: 0;
      box-shadow: 0 0 35px rgba(255, 34, 34, 0.35);
      border: 3px solid #cc0000;
    }
    .qr-img {
      width: 250px;
      height: 250px;
      display: block;
      image-rendering: pixelated;
    }
    .btc-address-box {
      background: #080808;
      border: 1px solid #333333;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 14px;
      word-break: break-all;
      color: #00ff66;
      width: 100%;
      letter-spacing: 0.6px;
      user-select: all;
    }
    .btn-copy {
      background: #cc0000;
      color: #ffffff;
      border: none;
      padding: 14px 36px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-copy:hover {
      background: #ff2222;
      transform: scale(1.03);
    }
    .btn-copy:active {
      transform: scale(0.97);
    }
    .back-link {
      color: #777777;
      font-size: 13px;
      text-decoration: none;
      margin-top: 6px;
      transition: color 0.15s;
    }
    .back-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }
    .toast {
      position: fixed;
      bottom: 35px;
      background: #00cc55;
      color: #000000;
      font-weight: bold;
      padding: 10px 22px;
      border-radius: 4px;
      display: none;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0, 204, 85, 0.4);
    }
  </style>
</head>
<body>
  <div class="donate-container">
    <div class="qr-frame">
      <img src="assets/btc_qr.png" alt="Bitcoin QR Code" class="qr-img">
    </div>

    <div class="btc-address-box" id="btcAddress" title="Endereço Bitcoin">
      bc1qdhvekhnhwl70wf0gzc8fgl8mxnxgng5um0fqvu
    </div>

    <button class="btn-copy" id="btnCopy" aria-label="Copiar endereço Bitcoin">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span id="btnCopyText">COPIAR</span>
    </button>

    <a href="index.html" class="back-link">&larr; VOLTAR AO SITE</a>
  </div>

  <div class="toast" id="toast">[OK] ENDEREÇO BITCOIN COPIADO!</div>

  <script src="js/donate.js"></script>
</body>
</html>
